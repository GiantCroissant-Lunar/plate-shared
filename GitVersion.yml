mode: ContinuousDelivery
branches:
  main:
    regex: ^main$
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    is-mainline: true
  develop:
    regex: ^develop$
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: true
    is-mainline: false
    tag: alpha
  feature:
    regex: ^feature[/-]
    increment: Inherit
    tag: '{BranchName}'
  release:
    regex: ^release[/-]
    increment: None
    prevent-increment-of-merged-branch-version: true
    tag: rc
  hotfix:
    regex: ^hotfix[/-]
    increment: Patch
    tag: beta
ignore:
  sha: []
