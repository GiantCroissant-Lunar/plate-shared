name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore dotnet/source-generators/SourceGenerators.sln

    - name: Build
      run: dotnet build dotnet/source-generators/SourceGenerators.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test dotnet/source-generators/SourceGenerators.sln --configuration Release --no-build --verbosity normal

    - name: Pack NuGet packages
      run: dotnet pack dotnet/source-generators/SourceGenerators.sln --configuration Release --no-build --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
